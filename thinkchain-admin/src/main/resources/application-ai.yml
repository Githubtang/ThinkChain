langchain4j:
  multi-model:
    models:
      - name: openai-gpt4o
        provider: openai
        apiKey: ${OPENAI_API_KEY:}
        baseUrl: "https://api.openai.com/v1"
        modelName: "gpt-4o"
        enabled: true
        capabilities:
          - text
          - chat

      - name: qwen3-omni-flash
        provider: dashscope
        apiKey: ${DASHSCOPE_API_KEY:}
        baseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        modelName: "qwen3-omni-flash"
        enabled: true
        capabilities:
          - text
          - chat
          - document
          - image
      - name: qwen3.5-plus
        provider: dashscope
        apiKey: ${DASHSCOPE_API_KEY:}
        baseUrl: "https://dashscope.aliyuncs.com/api/v1"
        modelName: "qwen3.5-plus"
        enabled: true
        capabilities:
          - text
          - chat
          - document
          - image

      - name: zhipu-glm
        provider: zhipu
        apiKey: ${ZHIPU_API_KEY:}
        baseUrl: "https://open.bigmodel.cn/api/paas/v4"
        modelName: "glm-4"
        enabled: true
        capabilities:
          - text
          - chat

thinkchain:
  rag:
    embedding:
      provider: dashscope
      apiKey: ${DASHSCOPE_API_KEY:}
      baseUrl: "https://dashscope.aliyuncs.com"
      modelName: "text-embedding-v4"
      dimensions: 1536
  vector:
    datasource:
      enabled: true
      driverClassName: org.postgresql.Driver
      url: jdbc:postgresql://localhost:5432/thinkchain
      username: postgres
      password: ${POSTGRES_PASSWORD:}