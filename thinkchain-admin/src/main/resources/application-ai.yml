langchain4j:
  multi-model:
    models:
      - name: openai-gpt4o
        provider: openai
        apiKey: "请在这里填 OpenAI Key"
        baseUrl: "https://api.openai.com/v1"
        modelName: "gpt-4o"
        enabled: true
        capabilities:
          - text
          - chat

      - name: qwen3-omni-flash
        provider: dashscope
        apiKey: "请填写 DashScope API Key"
        baseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        modelName: "qwen3-omni-flash"
        enabled: true
        capabilities:
          - text
          - chat
          - document
          - image
      - name: qwen3.5-plus
        provider: dashscope
        apiKey: "请填写 DashScope API Key"
        baseUrl: "https://dashscope.aliyuncs.com/api/v1"
        modelName: "qwen3.5-plus"
        enabled: true
        capabilities:
          - text
          - chat
          - document
          - image

      - name: zhipu-glm
        provider: zhipu
        apiKey: "请在这里填 ZhiPu Key"
        baseUrl: "https://open.bigmodel.cn/api/paas/v4"
        modelName: "glm-4"
        enabled: true
        capabilities:
          - text
          - chat