langchain4j:
  multi-model:
    models:
      - name: openai-gpt4o
        provider: openai
        apiKey: ${OPENAI_API_KEY:}
        baseUrl: "https://api.openai.com/v1"
        modelName: "gpt-4o"
        enabled: true
        capabilities:
          - text
          - chat

      - name: qwen3-omni-flash
        provider: dashscope
        apiKey: ${DASHSCOPE_API_KEY:}
        baseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        modelName: "qwen3-omni-flash"
        enabled: true
        capabilities:
          - text
          - chat
          - document
          - image
      - name: qwen3.5-plus
        provider: dashscope
        apiKey: ${DASHSCOPE_API_KEY:}
        baseUrl: "https://dashscope.aliyuncs.com/api/v1"
        modelName: "qwen3.5-plus"
        enabled: true
        capabilities:
          - text
          - chat
          - document
          - image

      - name: zhipu-glm
        provider: zhipu
        apiKey: ${ZHIPU_API_KEY:}
        baseUrl: "https://open.bigmodel.cn/api/paas/v4"
        modelName: "glm-4"
        enabled: true
        capabilities:
          - text
          - chat

thinkchain:
  rag:
    embedding:
      provider: dashscope
      apiKey: ${DASHSCOPE_API_KEY:}
      baseUrl: "https://dashscope.aliyuncs.com"
      modelName: "text-embedding-v4"
      dimensions: 1536

spring:
  datasource:
    druid:
      vector:
        enabled: true
        driverClassName: org.postgresql.Driver
        # Supabase Direct Connection（适用于支持 IPv6 的常驻后端）。
        # 若部署环境仅支持 IPv4，请改用 Dashboard -> Connect 中的 Session Pooler 地址。
        url: jdbc:postgresql://db.pkteuzurjbhnhzcnbkjz.supabase.co:5432/postgres?sslmode=require
        username: postgres
        password: a2545958861
        initialSize: 1
        minIdle: 1
        maxActive: 5
        maxWait: 60000
        connectTimeout: 30000
        socketTimeout: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        maxEvictableIdleTimeMillis: 900000
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
