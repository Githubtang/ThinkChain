langchain4j:
  multi-model:
    models:
      - name: openai-gpt4o
        provider: openai
        apiKey: ${OPENAI_API_KEY:}
        baseUrl: "https://api.openai.com/v1"
        modelName: "gpt-4o"
        enabled: true
        capabilities:
          - text
          - chat

      - name: qwen3.7-plus
        provider: dashscope
        apiKey: ${QWEN_API_KEY}
        baseUrl: "https://llm-wxfgsuswv5x5lqkd.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
        modelName: qwen3.7-plus
        enabled: true
        capabilities:
          - text
          - chat
          - document
          - image
          - video
          - audio

      - name: zhipu-glm
        provider: zhipu
        apiKey: ${ZHIPU_API_KEY:}
        baseUrl: "https://open.bigmodel.cn/api/paas/v4"
        modelName: "glm-4"
        enabled: true
        capabilities:
          - text
          - chat

thinkchain:
  rag:
    embedding:
      provider: dashscope
      apiKey: ${QWEN_API_KEY}
      baseUrl: "https://llm-wxfgsuswv5x5lqkd.cn-beijing.maas.aliyuncs.com"
      modelName: "qwen3.7-text-embedding"
      dimensions: 1536

spring:
  datasource:
    druid:
      vector:
        enabled: true
        driverClassName: org.postgresql.Driver
        # Supabase Direct Connection（适用于支持 IPv6 的常驻后端）。
        # 若部署环境仅支持 IPv4，请改用 Dashboard -> Connect 中的 Session Pooler 地址。
        url: jdbc:postgresql://db.pkteuzurjbhnhzcnbkjz.supabase.co:5432/postgres?sslmode=require
        username: postgres
        password: ${POSTGRES_PASSSWORD}
        initialSize: 1
        minIdle: 1
        maxActive: 5
        maxWait: 60000
        connectTimeout: 30000
        socketTimeout: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        maxEvictableIdleTimeMillis: 900000
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
