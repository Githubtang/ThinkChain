langchain4j:
  multi-model:
    models:
      - name: openai-gpt4o
        provider: openai
        apiKey: ${OPENAI_API_KEY:}
        baseUrl: "https://api.openai.com/v1"
        modelName: "gpt-4o"
        enabled: true
        capabilities:
          - text
          - chat

      - name: qwen3.7-plus
        provider: dashscope
        apiKey: sk-4de5835348a14c6987cc23e31ed68f48
        baseUrl: "https://llm-wxfgsuswv5x5lqkd.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
        modelName: qwen3.7-plus
        enabled: true
        capabilities:
          - text
          - chat
          - document
          - image
          - video
          - audio

      - name: zhipu-glm
        provider: zhipu
        apiKey: ${ZHIPU_API_KEY:}
        baseUrl: "https://open.bigmodel.cn/api/paas/v4"
        modelName: "glm-4"
        enabled: true
        capabilities:
          - text
          - chat

thinkchain:
  chat:
    protection:
      # 当前文档存储和后台任务按单实例设计；这里限制单用户同时占用的 SSE 模型连接。
      maxConcurrentStreams: 2
  rag:
    embedding:
      provider: dashscope
      apiKey: sk-4de5835348a14c6987cc23e31ed68f48
      baseUrl: "https://llm-wxfgsuswv5x5lqkd.cn-beijing.maas.aliyuncs.com"
      modelName: "qwen3.7-text-embedding"
      dimensions: 1536
      connectTimeoutMs: 10000
      readTimeoutMs: 60000
      maxRetries: 2
      retryDelayMs: 500
    retrieval:
      # 普通聊天和独立 RAG 接口共同使用这些默认值，请求显式传值时优先使用请求值。
      topK: 6
      minScore: 0.35
      maxContextChars: 12000
    processing:
      corePoolSize: 2
      maxPoolSize: 4
      queueCapacity: 100
      pollDelayMs: 60000
  dashscope:
    connectTimeoutMs: 10000
    readTimeoutMs: 120000
    writeTimeoutMs: 60000
    maxRetries: 1
    retryDelayMs: 500

spring:
  datasource:
    druid:
      vector:
        enabled: true
        driverClassName: org.postgresql.Driver
        # Supabase Direct Connection（适用于支持 IPv6 的常驻后端）。
        # 若部署环境仅支持 IPv4，请改用 Dashboard -> Connect 中的 Session Pooler 地址。
        url: jdbc:postgresql://db.pkteuzurjbhnhzcnbkjz.supabase.co:5432/postgres?sslmode=require
        username: postgres
        password: a2545958861
        initialSize: 1
        minIdle: 1
        maxActive: 5
        maxWait: 60000
        connectTimeout: 30000
        socketTimeout: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        maxEvictableIdleTimeMillis: 900000
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
