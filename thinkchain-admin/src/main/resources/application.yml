# 项目相关配置
thinkchain:
  # 名称
  name: ThinkChain
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/thinkchain/uploadPath，Linux配置 /home/thinkchain/uploadPath）
  profile: D:/thinkchain/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.tyh: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis-Plus配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.tyh.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc & Knife4j配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 测试接口
      packages-to-scan: com.tyh.web.controller.tool
    - group: Ai接口
      packages-to-scan: com.tyh.web.controller.chat

knife4j:
  enable: false
  setting:
    language: zh_cn

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1
# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

langchain4j:
  # 定义多个模型配置
  multi-model:
    enabled: true
    # 当前启用的模型 (手动切换时用)
    active-model: dashscope-qwen
    models:
      - name: openai-gpt4o
        provider: openai
        api-key: "请在这里填 OpenAI Key"
        base-url: https://api.openai.com/v1
        model-name: gpt-4o
        free-limit: 0  # 0 表示付费，优先级低
        priority: 3

      - name: dashscope-qwen
        provider: dashscope
        api-key: "sk-037f79dcfc324c8eb0f2d9fe37039be5"
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model-name: qwen-plus
        free-limit: 1000000  # 免费额度 (token)
        priority: 1

      - name: zhipu-glm
        provider: zhipu
        api-key: "请在这里填 ZhiPu Key"
        base-url: https://open.bigmodel.cn/api/paas/v4
        model-name: glm-4
        free-limit: 1000000
        priority: 2
